services:
  permissions:
    # The application image deliberately runs without root privileges. Prepare
    # only its bind-mounted writable paths once, so the same Stack works on
    # Docker Engine, NAS Compose panels and macOS desktop runtimes.
    image: alpine:3.21
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data /downloads
        # data is small application state and may come from an older root-run
        # image; downloaded files can be huge, so only its directory itself
        # changes owner and every existing final file is left untouched.
        chown -R 65532:65532 /data
        chown 65532:65532 /downloads
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    networks: [internal]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${TDL_POSTGRES_DB:?set TDL_POSTGRES_DB in .env}
      POSTGRES_USER: ${TDL_POSTGRES_USER:?set TDL_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TDL_POSTGRES_PASSWORD:?set TDL_POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TDL_DATA_DIR: /data
      TDL_DOWNLOAD_DIR: /downloads
      TDL_LISTEN_ADDR: :8080
      TDL_DATABASE_URL: ${TDL_DATABASE_URL:?set TDL_DATABASE_URL in .env}
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    networks: [internal]
    depends_on:
      permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    driver: bridge
