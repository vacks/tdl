services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tdl
      POSTGRES_USER: tdl
      POSTGRES_PASSWORD: tdl-postgres-7rQ4mX9pL2vN8kD6
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    image: ghcr.io/vacks/tdl:1.2.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TDL_DATA_DIR: /data
      TDL_DOWNLOAD_DIR: /downloads
      TDL_LISTEN_ADDR: :8080
      TDL_ADMIN_USERNAME: admin
      TDL_ADMIN_INITIAL_PASSWORD: admin
      TDL_DATABASE_URL: postgres://tdl:tdl-postgres-7rQ4mX9pL2vN8kD6@postgres:5432/tdl?sslmode=disable
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    driver: bridge
